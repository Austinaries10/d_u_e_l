name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The AI endpoint (api/lens.php) needs the Anthropic PHP SDK; install it here so the hosting needs no Composer
      - name: Install PHP libraries
        run: composer install --working-dir=server --no-dev --no-interaction --prefer-dist --optimize-autoloader

      # Uploads only changed files. Files on the server that this repo never uploaded
      # (for example cPanel's .htaccess) are left alone.
      - name: Upload to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            server/config.php
